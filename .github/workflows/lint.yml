name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Bash syntax & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check bash syntax
        run: bash -n ag-setup.sh

      - name: Run ShellCheck
        run: shellcheck ag-setup.sh
